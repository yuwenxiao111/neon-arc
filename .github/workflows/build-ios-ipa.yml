name: build-ios-ipa

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: unzip-src
        run: |
          if [ -f src.zip ]; then unzip -o -q src.zip -d .; fi
          ls -la
          ls -la app ios || true
      - name: copy-h5
        run: |
          rm -rf ios/h5
          mkdir -p ios/h5
          cp app/index.html ios/h5/
          cp app/game.js ios/h5/
      - name: xcodegen
        run: brew install xcodegen
      - name: gen-project
        run: |
          cd ios
          xcodegen generate
          ls -la
      - name: build
        run: |
          cd ios
          xcodebuild -project StarArc.xcodeproj -scheme StarArc -configuration Release -sdk iphoneos -archivePath "$PWD/build/StarArc.xcarchive" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" archive
      - name: pack-ipa
        run: |
          cd ios
          APP=$(find build/StarArc.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -n 1)
          echo "APP=$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry StarArc.ipa Payload
          ls -lh StarArc.ipa
      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: StarArc-unsigned-ipa
          path: ios/StarArc.ipa
          retention-days: 30
